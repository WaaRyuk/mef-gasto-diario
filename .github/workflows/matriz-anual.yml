name: Ejecucion anio actual MATRIZ

permissions:
  contents: write

on:
  schedule:
    - cron: '7 14 * * *'   # 9:07 am hora Peru, todos los dias
  workflow_dispatch:        # tambien permite correrlo a mano

jobs:
  ejecutar-anio-actual:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script anio actual
        run: python scripts/extraer_ejecucion_anio_actual.py

      - name: Guardar resultado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ejecucion-anio-actual
          path: ejecucion_*.csv

      - name: Guardar resultado en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          cp ejecucion_*.csv output/
          git add output/ejecucion_*.csv
          git commit -m "Actualiza ejecucion MATRIZ anio actual" || echo "Sin cambios"
          git pull --rebase origin main
          git push
