name: Fichas SSI inversiones MINEM
permissions:
  contents: write
on:
  schedule:
    # En UTC; Peru es UTC-5. 10:41 hora Peru, despues del primer resumen diario.
    - cron: '41 15 * * *'
  workflow_dispatch:
jobs:
  extraer-ssi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Consultar SSI
        run: python scripts/extraer_ssi_inversiones.py
      - name: Guardar resultados en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ssi_*.csv
          git commit -m "Actualiza fichas SSI" || echo "Sin cambios"
          git pull --rebase origin main
          git push
