name: Resumen diario MEF
permissions:
  contents: write
on:
  schedule:
    - cron: '7 14 * * *'
    - cron: '7 16 * * *'
    - cron: '7 18 * * *'
    - cron: '7 20 * * *'
  workflow_dispatch:
jobs:
  ejecutar-resumen:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar script
        run: python scripts/resumen_combinado.py
      - name: Guardar resultados como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: resumenes-mef
          path: |
            energia_minas_resumen.csv
            economia_finanzas_resumen.csv
      - name: Guardar resultados en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          cp energia_minas_resumen.csv output/energia_minas_resumen.csv
          cp economia_finanzas_resumen.csv output/economia_finanzas_resumen.csv
          git add output/energia_minas_resumen.csv output/economia_finanzas_resumen.csv
          git commit -m "Actualiza resumenes diarios" || echo "Sin cambios"
          git pull --rebase origin main
          git push
